[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archaios"
version = "0.1.0"
description = "Interpretable ARC-style object-centric program synthesis prototype"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
archaios = "archaios.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
